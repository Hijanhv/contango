[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false
shrink_run_limit = 1000

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 512
depth = 128

# Arc is Circle's stablecoin-native L1: USDC is the native gas token (18 decimals),
# sub-second deterministic finality (Malachite consensus).
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"
anvil = "http://127.0.0.1:8545"
